<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Controle de Estoque - Loja</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f7f7f7;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2a7ae2;
    }
    form {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    label {
      display: block;
      margin: 8px 0 4px;
      font-weight: bold;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background: #2a7ae2;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #1a5ec8;
    }
    #produtos {
      max-width: 900px;
      margin: 0 auto;
      border-collapse: collapse;
      width: 100%;
    }
    #produtos th, #produtos td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: left;
    }
    #produtos th {
      background: #2a7ae2;
      color: white;
    }
    .alerta {
      color: red;
      font-weight: bold;
    }
    .acoes button {
      margin-right: 5px;
    }
    #filtros {
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    #filtros input, #filtros select {
      width: auto;
      margin-right: 10px;
    }
  </style>
</head>
<body>

<h1>Controle de Estoque - Loja</h1>

<form id="formProduto">
  <input type="hidden" id="produtoId" value="" />
  <label for="nome">Nome do Produto</label>
  <input type="text" id="nome" required />

  <label for="categoria">Categoria</label>
  <input type="text" id="categoria" required />

  <label for="marca">Marca</label>
  <input type="text" id="marca" required />

  <label for="modelo">Modelo</label>
  <input type="text" id="modelo" required />

  <label for="quantidade">Quantidade em Estoque</label>
  <input type="number" id="quantidade" min="0" required />

  <label for="preco_custo">Preço de Custo</label>
  <input type="number" id="preco_custo" min="0" step="0.01" required />

  <label for="preco_venda">Preço de Venda</label>
  <input type="number" id="preco_venda" min="0" step="0.01" required />

  <label for="codigo">Código do Produto</label>
  <input type="text" id="codigo" required />

  <button type="submit">Salvar Produto</button>
</form>

<div id="filtros">
  <input type="text" id="filtroBusca" placeholder="Buscar por nome, categoria, marca, modelo ou código" />
  <select id="filtroCategoria">
    <option value="">Todas Categorias</option>
  </select>
  <button id="btnFiltrar">Filtrar</button>
  <button id="btnLimparFiltro">Limpar Filtro</button>
</div>

<table id="produtos">
  <thead>
    <tr>
      <th>Nome</th>
      <th>Categoria</th>
      <th>Marca</th>
      <th>Modelo</th>
      <th>Qtd Estoque</th>
      <th>Preço Custo</th>
      <th>Preço Venda</th>
      <th>Código</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody id="listaProdutos">
    <!-- Produtos aparecerão aqui -->
  </tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // === CONFIGURE AQUI A URL DO SEU PROJETO E SUA CHAVE PUBLICA (anon key) ===
  const supabaseUrl = 'https://kjblifplvtgpkopolyjx.supabase.co';
  const supabaseAnonKey = 'sb_publishable_97CA-EQIAtNhiit8QiiQuQ_HeoFVARF';

  const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

  const formProduto = document.getElementById('formProduto');
  const listaProdutos = document.getElementById('listaProdutos');
  const filtroBusca = document.getElementById('filtroBusca');
  const filtroCategoria = document.getElementById('filtroCategoria');
  const btnFiltrar = document.getElementById('btnFiltrar');
  const btnLimparFiltro = document.getElementById('btnLimparFiltro');

  // Carrega produtos do Supabase e popula a tabela
  async function carregarProdutos(filtro = {}) {
    let query = supabase.from('produtos').select('*');

    if (filtro.busca) {
      query = query.ilike('nome', `%${filtro.busca}%`)
        .or(`categoria.ilike.%${filtro.busca}%,marca.ilike.%${filtro.busca}%,modelo.ilike.%${filtro.busca}%,codigo.ilike.%${filtro.busca}%`);
    }

    if (filtro.categoria && filtro.categoria !== '') {
      query = query.eq('categoria', filtro.categoria);
    }

    const { data, error } = await query.order('nome', { ascending: true });
    if (error) {
      alert('Erro ao carregar produtos: ' + error.message);
      return;
    }

    listaProdutos.innerHTML = '';
    const categoriasSet = new Set();

    data.forEach(prod => {
      categoriasSet.add(prod.categoria);

      const alertaEstoqueBaixo = prod.quantidade < 5 ? `<span class="alerta" title="Estoque baixo!">&#9888;</span>` : '';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${prod.nome}</td>
        <td>${prod.categoria}</td>
        <td>${prod.marca}</td>
        <td>${prod.modelo}</td>
        <td>${prod.quantidade} ${alertaEstoqueBaixo}</td>
        <td>R$ ${prod.preco_custo.toFixed(2)}</td>
        <td>R$ ${prod.preco_venda.toFixed(2)}</td>
        <td>${prod.codigo}</td>
        <td class="acoes">
          <button onclick="editarProduto('${prod.id}')">Editar</button>
          <button onclick="excluirProduto('${prod.id}')">Excluir</button>
        </td>
      `;
      listaProdutos.appendChild(tr);
    });

    // Atualiza filtro de categoria
    filtroCategoria.innerHTML = '<option value="">Todas Categorias</option>';
    Array.from(categoriasSet).sort().forEach(cat => {
      filtroCategoria.innerHTML += `<option value="${cat}">${cat}</option>`;
    });
  }

  async function salvarProduto(e) {
    e.preventDefault();
    const id = document.getElementById('produtoId').value;
    const nome = document.getElementById('nome').value.trim();
    const categoria = document.getElementById('categoria').value.trim();
    const marca = document.getElementById('marca').value.trim();
    const modelo = document.getElementById('modelo').value.trim();
    const quantidade = parseInt(document.getElementById('quantidade').value);
    const preco_custo = parseFloat(document.getElementById('preco_custo').value);
    const preco_venda = parseFloat(document.getElementById('preco_venda').value);
    const codigo = document.getElementById('codigo').value.trim();

    if (!nome || !categoria || !marca || !modelo || isNaN(quantidade) || isNaN(preco_custo) || isNaN(preco_venda) || !codigo) {
      alert('Por favor, preencha todos os campos corretamente.');
      return;
    }

    if (id) {
      // Atualizar produto
      const { error } = await supabase.from('produtos').update({
        nome, categoria, marca, modelo, quantidade, preco_custo, preco_venda, codigo
      }).eq('id', id);
      if (error) {
        alert('Erro ao atualizar produto: ' + error.message);
        return;
      }
      alert('Produto atualizado com sucesso!');
    } else {
      // Inserir novo produto
      const { error } = await supabase.from('produtos').insert({
        nome, categoria, marca, modelo, quantidade, preco_custo, preco_venda, codigo
      });
      if (error) {
        alert('Erro ao cadastrar produto: ' + error.message);
        return;
      }
      alert('Produto cadastrado com sucesso!');
    }
    limparFormulario();
    carregarProdutos();
  }

  function limparFormulario() {
    formProduto.reset();
    document.getElementById('produtoId').value = '';
  }

  async function editarProduto(id) {
    const { data, error } = await supabase.from('produtos').select('*').eq('id', id).single();
    if (error) {
      alert('Erro ao buscar produto: ' + error.message);
      return;
    }
    document.getElementById('produtoId').value = data.id;
    document.getElementById('nome').value = data.nome;
    document.getElementById('categoria').value = data.categoria;
    document.getElementById('marca').value = data.marca;
    document.getElementById('modelo').value = data.modelo;
    document.getElementById('quantidade').value = data.quantidade;
    document.getElementById('preco_custo').value = data.preco_custo;
    document.getElementById('preco_venda').value = data.preco_venda;
    document.getElementById('codigo').value = data.codigo;
  }

  async function excluirProduto(id) {
    if (!confirm('Tem certeza que deseja excluir este produto?')) {
      return;
    }
    const { error } = await supabase.from('produtos').delete().eq('id', id);
    if (error) {
      alert('Erro ao excluir: ' + error.message);
      return;
    }
    alert('Produto excluído com sucesso!');
    carregarProdutos();
  }

  btnFiltrar.addEventListener('click', () => {
    carregarProdutos({
      busca: filtroBusca.value.trim(),
      categoria: filtroCategoria.value
    });
  });

  btnLimparFiltro.addEventListener('click', () => {
    filtroBusca.value = '';
    filtroCategoria.value = '';
    carregarProdutos();
  });

  formProduto.addEventListener('submit', salvarProduto);

  // Carregar produtos ao iniciar
  carregarProdutos();
</script>

</body>
</html>
